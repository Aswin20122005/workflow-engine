name: CI – Build & Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # One Maven invocation: compile, unit + integration tests, package.
      - name: Build and test
        run: mvn -B verify

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: workflow-engine-jar
          path: target/*.jar

  docker:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t workflow-engine:ci .

      - name: Start container and wait for it to be healthy
        run: |
          docker run -d --name app -p 8080:8080 workflow-engine:ci
          for i in $(seq 1 30); do
            state=$(docker inspect -f '{{.State.Health.Status}}' app)
            echo "health: $state"
            [ "$state" = healthy ] && break
            sleep 3
          done
          [ "$state" = healthy ] || { docker logs app; exit 1; }

      - name: Smoke test the API
        run: |
          curl -fsS http://localhost:8080/api/workflows | grep -q "Employee Onboarding"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/workflows/99999)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/h2-console)" = 404

      - name: Graceful stop
        run: |
          docker stop -t 30 app
          docker logs app 2>&1 | tail -5
          test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 143 || test "$(docker inspect -f '{{.State.ExitCode}}' app)" = 0
