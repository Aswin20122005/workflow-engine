# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=AI Workflow Automation Engine

# ─── H2 In-Memory Database (default / dev) ────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:workflowdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── JPA / Hibernate ──────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ─── AI API (set your key in env: AI_API_KEY) ─────────────────────────────────
# Leave as 'demo-mode' to run without a real AI API key
ai.api.key=${AI_API_KEY:demo-mode}
ai.api.url=https://api.anthropic.com/v1/messages
ai.api.model=${AI_MODEL:claude-haiku-5-5}

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.workflowengine=INFO
logging.level.org.springframework.web=WARN
