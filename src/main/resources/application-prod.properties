# Production: MySQL instead of in-memory H2.
# Run with SPRING_PROFILES_ACTIVE=prod and set DB_URL, DB_USERNAME, DB_PASSWORD.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/workflowdb}
spring.datasource.username=${DB_USERNAME:workflow}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Keep data between restarts (the default profile drops the schema on shutdown).
spring.jpa.hibernate.ddl-auto=update
